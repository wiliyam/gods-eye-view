server {
    listen 80;
    server_name gv.arkbytetech.com;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://gv.arkbytetech.com$request_uri; }
}

server {
    listen 443 ssl;
    server_name gv.arkbytetech.com;
    # Do not serve the app for an old alias or direct-IP request if this
    # virtual host becomes Nginx's default HTTPS server.
    if ($host != gv.arkbytetech.com) { return 444; }
    if ($ssl_server_name != gv.arkbytetech.com) { return 444; }
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/gv.arkbytetech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gv.arkbytetech.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    client_max_body_size 5m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    auth_basic "Gods Eye View";
    auth_basic_user_file /etc/nginx/gods-eye-view.htpasswd;

    location ^~ /api/setup/ { return 404; }
    location ~ /\. { return 404; }
    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:4173;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
